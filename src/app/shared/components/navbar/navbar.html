<nav>
  <div class="inner">
    <a class="brand" (click)="scrollTo('about')">Abdallah Nagy</a>

    <div class="right">
      <ul class="links">
        @for (link of links; track link.id) {
          <li>
            <button
              [class.active]="activeSection() === link.id"
              (click)="scrollTo(link.id)"
            >
              {{ link.label }}
            </button>
          </li>
        }
      </ul>
      <button type="button" class="hire" (click)="openHire()">Hire me</button>
    </div>
  </div>
</nav>

<dialog #hireDialog class="hire-dialog" aria-labelledby="hire-title" (click)="onDialogClick($event)">
  <div class="dialog-inner">
    <header>
      <div>
        <h2 id="hire-title">Let's work together</h2>
        <p>Open to full-time roles and freelance Dynamics 365, Power Platform, .NET and Angular work.</p>
      </div>
      <button type="button" class="close" aria-label="Close" (click)="closeHire()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </header>

    <div class="block">
      <h3>CV</h3>
      <div class="row">
        <a [href]="cvUrl" target="_blank" rel="noopener" class="btn">View CV</a>
        <a [href]="cvUrl" [attr.download]="cvFilename" class="btn primary">Download CV</a>
      </div>
    </div>

    <div class="block">
      <h3>Email</h3>
      <div class="row email-row">
        <a [href]="'mailto:' + email" class="email">{{ email }}</a>
        <button type="button" class="btn small" (click)="copyEmail()">
          {{ copied() ? 'Copied!' : 'Copy' }}
        </button>
      </div>
    </div>

    <button type="button" class="link" (click)="closeHire(); scrollTo('contact')">
      Or send me a message →
    </button>
  </div>
</dialog>
